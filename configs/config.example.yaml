server:
  addr: ":8080"
  admin_key: "change-me-admin-key"
  shutdown_timeout: 15s
  # Bound how long a client may take to send a request and how long an idle
  # keep-alive connection is held; without these a slow client can pin sockets.
  read_timeout: 60s
  idle_timeout: 120s
  # Largest proxied client request body. Bigger requests get 413.
  max_request_bytes: 10485760

auth:
  file: "./auth.json"
  upstream_base: "https://api.x.ai/v1"
  refresh_skew: 5m
  # issuer: "https://auth.x.ai"
  # client_id: ""
  # account: ""  # optional map key prefix filter

db:
  # Prefer postgres in production (no local PVC required).
  driver: "postgres" # sqlite | postgres
  dsn: "host=localhost user=proxy password=proxy dbname=proxy port=5432 sslmode=disable"
  # driver: "sqlite"
  # dsn: "./data/proxy.db"

rate_limit:
  rps: 10
  burst: 20

cors:
  allowed_origins:
    - "*"

log:
  level: "info"
  redact: true

# Proxied request/response bodies stored in DB (admin /admin/audit).
audit:
  enabled: true
  # Caps only what is stored per side. It does NOT truncate the request that is
  # forwarded upstream — see server.max_request_bytes for that.
  max_body_bytes: 65536

metrics:
  enabled: true
  path: "/metrics"
